name: Publish
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Blank (auto), a version (1.4.1), or major/minor/patch
        type: string
      dryRun:
        description: Dry Run?
        type: boolean
        default: false

jobs:
  validate:
    name: Validate
    uses: "./.github/workflows/validate.yml"
    secrets: inherit

  publish:
    name: Publish
    runs-on: ubuntu-24.04
    needs: [validate]
    permissions:
      contents: write # Allow pushing
      id-token: write # Enable OIDC for NPM and JSR
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update NPM for Provence
        run: sudo npm i -g npm@11
      - name: Bump and Release
        uses: aklinker1/zero-changelog/actions/release@e64ae0d840d3036af6c8bc0a7a117593c1467ec9 # 0.2.2
        with:
          bump: ${{ inputs.bump }}
          publishCommands: |-
            mv README.md GITHUB-README.md
            mv NPM-README.md README.md
            npm publish
            mv README.md NPM-README.md
            mv GITHUB-README.md README.md
            bunx jsr publish --allow-dirty
          dryRun: ${{ inputs.dryRun }}
          dryRunPublishCommands: |-
            npm publish --dry-run
            bunx jsr publish --dry-run --allow-dirty
          githubToken: ${{ secrets.GITHUB_TOKEN }}
